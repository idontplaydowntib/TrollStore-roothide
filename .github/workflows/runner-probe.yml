name: Runner probe

on:
  workflow_dispatch:

jobs:
  probe-macos-13:
    runs-on: macos-13
    steps:
      - run: uname -a && sw_vers

  probe-macos-14:
    runs-on: macos-14
    steps:
      - run: uname -a && sw_vers

  probe-macos-15:
    runs-on: macos-15
    steps:
      - run: uname -a && sw_vers

  probe-macos-latest:
    runs-on: macos-latest
    steps:
      - run: uname -a && sw_vers

  probe-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: uname -a